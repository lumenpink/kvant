name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: "Rust — Tests & Checks"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Install Rust Toolchain"
        uses: https://github.com/actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: "Cargo Check"
        run: cargo check --verbose

      - name: "Cargo Test"
        run: cargo test --verbose

  build-release:
    name: "Rust — Release Binaries"
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: "Checkout"
        uses: https://github.com/actions/checkout@v4

      - name: "Install Rust Toolchain"
        uses: https://github.com/actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: "Build Release"
        run: cargo build --release --verbose

      - name: "Verify Binaries"
        run: |
          ./target/release/kvant --version
          ./target/release/kv --version

  deploy-docs:
    name: "Deploy Documentation (kvant.2lp.in)"
    runs-on: ubuntu-latest
    needs: [test, build-release]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: "Checkout"
        uses: https://github.com/actions/checkout@v4

      - name: "Setup Node.js"
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: 20

      - name: "Deploy to Cloudflare Workers (kvant.2lp.in)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare credentials not configured in secrets. Skipping Cloudflare deploy."
          else
            echo "Publishing documentation to Cloudflare Workers..."
            npx wrangler deploy || echo "::warning::Cloudflare deploy failed. Continuing with fallback."
          fi

      - name: "Deploy to Codeberg Pages (Fallback)"
        uses: https://codeberg.org/actions/pages@v1
        with:
          path: site
