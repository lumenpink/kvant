[rules.KOLLONTAI-010]
description = "API contract files must be valid OpenAPI 3.x specifications"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-010"
name = "API-CONTRACT-OPENAPI"
scope = "project"
script = """
if gost.file_exists("docs/openapi.yaml") then
    local content = gost.read_file("docs/openapi.yaml") or ""
    if not content:match("openapi:%s*3%.") then
        return false, "ERR_OPENAPI_SPEC_INVALID", { file = "docs/openapi.yaml" }
    end
end
if gost.is_dir("docs/external") then
    local files = gost.list_files("docs/external") or {}
    for _, file in ipairs(files) do
        if file:match("%.ya?ml$") then
            local content = gost.read_file(file) or ""
            if not content:match("openapi:%s*3%.") then
                return false, "ERR_OPENAPI_SPEC_INVALID", { file = file }
            end
        end
    end
end
return true
"""
severity = "error"
tier = 1

[rules.KOLLONTAI-010.messages]
ERR_OPENAPI_SPEC_INVALID = "API contract schema in '{file}' must declare OpenAPI 3.x ('openapi: 3.x.x')"

[rules.KOLLONTAI-011]
description = "Documentation and markdown files must not contain prohibited terms"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-011"
name = "FORBIDDEN-TERMS"
scope = "docs"
script = """
local files = gost.list_files("docs") or {}
for _, file in ipairs(files) do
    if file:match("%.md$") then
        local content = gost.read_file(file) or ""
        if content:lower():match("soberan") then
            return false, "ERR_FORBIDDEN_TERM_FOUND", { file = file }
        end
    end
end
return true
"""
severity = "error"
tier = 1

[rules.KOLLONTAI-011.messages]
ERR_FORBIDDEN_TERM_FOUND = "Forbidden term found in documentation file '{file}'"

[rules.KOLLONTAI-012]
description = "Compiled binary artifacts must pass a basic smoke test without SIGSEGV or panic"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-012"
name = "SMOKE-TEST-SANITY-POST-BUILD"
scope = "post-build"
script = """
local bin = gost.target_binary()
if not bin or bin == "" then
    return true
end

local res = gost.exec_artifact(bin, { "--help" }, 3000)
if not res.ok then
    if res.signal == 11 or res.exit_code == 139 then
        return false, "ERR_SMOKE_SEGFAULT", { binary = bin }
    elseif res.stderr and res.stderr:match("panicked at") then
        return false, "ERR_SMOKE_PANIC", { binary = bin, error = res.stderr }
    else
        return false, "ERR_SMOKE_EXEC_FAILED", { binary = bin, exit_code = res.exit_code or -1 }
    end
end
return true
"""
severity = "error"
tier = 1

[rules.KOLLONTAI-012.messages]
ERR_SMOKE_EXEC_FAILED = "Post-build smoke test failed: binary '{binary}' exited with non-zero status ({exit_code})"
ERR_SMOKE_PANIC = "Post-build smoke test failed: binary '{binary}' panicked on startup: {error}"
ERR_SMOKE_SEGFAULT = "Post-build smoke test failed: binary '{binary}' terminated with Segmentation Fault (SIGSEGV)"

[rules.KOLLONTAI-013]
description = "Internationalization dictionary key parity across declared languages in GOSTVER"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-013"
name = "INTL-KEY-PARITY"
scope = "project"
script = """
local gostver = gost.read_file("GOSTVER") or ""
local langs = gostver:match("LANGUAGES%s*=%s*([%w,]+)")
if not langs or langs == "" or langs == "ALL" then
    return true
end
return true
"""
severity = "error"
tier = 1

[rules.KOLLONTAI-013.messages]
ERR_INTL_PARITY_MISMATCH = "Translation dictionaries do not share key parity for declared languages"

[rules.KOLLONTAI-014]
description = "CSS logical properties and dir=rtl must be used when RTL languages are declared"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-014"
name = "RTL-LOGICAL-PROPERTIES-AUDIT"
scope = "project"
script = """
local gostver = gost.read_file("GOSTVER") or ""
local langs = gostver:match("LANGUAGES%s*=%s*([%w,]+)")
if not langs then
    return true
end
if langs:match("ar") or langs:match("he") or langs:match("fa") or langs:match("ur") then
    if gost.is_dir("site") then
        local html_files = gost.list_files("site") or {}
        local has_rtl_support = false
        for _, f in ipairs(html_files) do
            if f:match("%.html$") or f:match("%.css$") then
                local content = gost.read_file(f) or ""
                if content:match("dir=") or content:match("margin%-inline") or content:match("padding%-inline") then
                    has_rtl_support = true
                    break
                end
            end
        end
        if not has_rtl_support then
            return false, "ERR_RTL_SUPPORT_MISSING", {}
        end
    end
end
return true
"""
severity = "error"
tier = 1

[rules.KOLLONTAI-014.messages]
ERR_RTL_SUPPORT_MISSING = "RTL language declared in GOSTVER but site lacks CSS logical properties or dir='rtl'"

[rules.KOLLONTAI-015]
description = "Client router must adopt English (en) as default fallback when visitor browser language is unavailable"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-015"
name = "I18N-SITE-FALLBACK-ENGLISH"
scope = "project"
script = """
if not gost.is_dir("site") then
    return true
end
local router_files = {"site/router.js", "site/index.html", "site/assets/app.js"}
for _, p in ipairs(router_files) do
    if gost.file_exists(p) then
        local content = gost.read_file(p) or ""
        if content:match("fallback") and not content:match('"en"') and not content:match("'en'") then
            return false, "ERR_FALLBACK_NOT_ENGLISH", { file = p }
        end
    end
end
return true
"""
severity = "error"
tier = 1

[rules.KOLLONTAI-015.messages]
ERR_FALLBACK_NOT_ENGLISH = "Website router in '{file}' must configure English ('en') as default fallback language"

[rules.KOLLONTAI-016]
description = "Package manifests must not contain local filesystem path dependencies (path = '...')"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-016"
name = "FORBIDDEN-PATH-DEPENDENCIES"
scope = "project"
script = '''
local manifests = {"Cargo.toml", "package.json", "go.mod", "pyproject.toml"}
for _, m in ipairs(manifests) do
    if gost.file_exists(m) then
        local content = gost.read_file(m) or ""
        if m == "Cargo.toml" and (content:match('path%s*=%s*["\']%s*%.%.') or content:match('path%s*=%s*["\']%s*/')) then
            return false, "ERR_PATH_DEPENDENCY_FORBIDDEN", { file = m }
        end
        if m == "package.json" and (content:match('"file:') or content:match('"link:')) then
            return false, "ERR_PATH_DEPENDENCY_FORBIDDEN", { file = m }
        end
    end
end
return true
'''
severity = "error"
tier = 1

[rules.KOLLONTAI-016.messages]
ERR_PATH_DEPENDENCY_FORBIDDEN = "Local filesystem path dependency detected in manifest '{file}'. Use canonical package registries."

[rules.KOLLONTAI-017]
description = "Repositories must have an authorized root LICENSE (GPL-3.0 by default) and compliant modular satellites"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-017"
name = "LICENSING-MATRIX-COMPLIANCE"
scope = "project"
script = """
local license_content = nil
local license_file = nil
if gost.file_exists("LICENSE") then
    license_content = gost.read_file("LICENSE")
    license_file = "LICENSE"
elseif gost.file_exists("LICENSE.md") then
    license_content = gost.read_file("LICENSE.md")
    license_file = "LICENSE.md"
end

if not license_content or license_content:match("^%s*$") then
    return false, "ERR_LICENSE_FILE_MISSING", { file = "LICENSE" }
end

local lower = license_content:lower()
local valid_root = false
if lower:match("general public license") or lower:match("gnu affero") or lower:match("gpl") then
    valid_root = true
elseif lower:match("apache license") and (lower:match("2%.0") or lower:match("version 2")) then
    valid_root = true
elseif lower:match("creative commons") and (lower:match("sharealike") or lower:match("by%-sa")) then
    valid_root = true
end

if not valid_root then
    return false, "ERR_LICENSE_INVALID_SPDX", { file = license_file }
end

-- Validate satellites if present
local satellites = {
    ["LICENSE-MEDIA"] = { "creative commons", "by%-sa" },
    ["LICENSE-LOGO"] = { "creative commons", "by%-nd" },
    ["LICENSE-APACHE"] = { "apache license" },
}

for sat_name, required_patterns in pairs(satellites) do
    if gost.file_exists(sat_name) then
        local sat_content = (gost.read_file(sat_name) or ""):lower()
        for _, pat in ipairs(required_patterns) do
            if not sat_content:match(pat) then
                return false, "ERR_SATELLITE_LICENSE_INVALID", { file = sat_name }
            end
        end
    end
end

return true
"""
severity = "error"
tier = 1

[rules.KOLLONTAI-017.messages]
ERR_LICENSE_FILE_MISSING = "Root license file '{file}' is required but was not found"
ERR_LICENSE_INVALID_SPDX = "Root license in '{file}' must be an authorized GOST license (GPL-3.0, AGPL-3.0, Apache-2.0 or CC-BY-SA-4.0)"
ERR_SATELLITE_LICENSE_INVALID = "Modular satellite license '{file}' does not match required canonical terms"

[rules.KOLLONTAI-018]
description = "Git hooks must be installed and actively managed by the cccp maestro"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-018"
name = "GIT-HOOKS-MAESTRO-PARITY"
scope = "project"
script = '''
-- If not a git repository (e.g. source tarball or CI container export), skip
if not gost.is_dir(".git") and not gost.file_exists(".git") then
    return true
end

-- Resolve hooks directory from .git/config (core.hooksPath) or default to .git/hooks
local hooks_dir = ".git/hooks"
if gost.file_exists(".git/config") then
    local cfg = gost.read_file(".git/config") or ""
    local custom_hooks = cfg:match("hooksPath%s*=%s*([^\r\n]+)")
    if custom_hooks then
        custom_hooks = custom_hooks:gsub('^%s*[\'"]?', ''):gsub('[\'"]?%s*$', '')
        if custom_hooks ~= "" then
            hooks_dir = custom_hooks
        end
    end
end

-- Essential hooks managed by the maestro
local required_hooks = { "commit-msg", "pre-commit", "pre-push" }

for _, hook_name in ipairs(required_hooks) do
    local hook_path = hooks_dir .. "/" .. hook_name
    if not gost.file_exists(hook_path) then
        return false, "ERR_GIT_HOOK_MISSING", { hook = hook_name }
    end

    local content = gost.read_file(hook_path) or ""
    if not content:match("cccp%-hook%-") and not content:match("cccp hook") then
        return false, "ERR_GIT_HOOK_NOT_MANAGED", { hook = hook_name }
    end
end

return true
'''
severity = "error"
tier = 1

[rules.KOLLONTAI-018.messages]
ERR_GIT_HOOK_MISSING = "Git hook '{hook}' is missing. Run 'cccp hook install' to install maestro hooks."
ERR_GIT_HOOK_NOT_MANAGED = "Git hook '{hook}' is not managed by the cccp maestro. Run 'cccp hook install --force' to synchronize hooks."

[rules.LILYA-001]
